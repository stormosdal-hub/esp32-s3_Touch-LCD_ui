<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCD UI Designer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo"></span>LCD UI Designer</div>
  <div id="docname" class="docname" title="Layout name"></div>
  <div class="spacer"></div>
  <span id="status" class="status off" title="Connection to the device">offline</span>
  <button id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="btnRedo" title="Redo (Ctrl+Y)">Redo</button>
  <button id="btnImport" title="Load a layout file from your computer">Import</button>
  <button id="btnExport" title="Download the layout as a JSON file">Export</button>
  <button id="btnReload" title="Discard changes and load the layout running on the device">Reload</button>
  <button id="btnShot" title="Screenshot of the real screen">Screenshot</button>
  <button id="btnDeploy" class="primary" title="Save to the device and show it on the screen (Ctrl+S)">Deploy</button>
  <input id="fileImport" type="file" accept=".json,application/json" hidden>
</header>
<main>
  <aside id="left">
    <section>
      <h3>Add widget</h3>
      <div id="palette" class="palette"></div>
    </section>
    <section>
      <h3>Tabs <button id="btnAddTab" class="mini" title="Add tab">+</button></h3>
      <ul id="tabList" class="list"></ul>
    </section>
    <section>
      <h3>Widgets on this tab</h3>
      <ul id="widgetList" class="list small"></ul>
    </section>
  </aside>
  <section id="center">
    <div class="toolbar">
      <label>Zoom <select id="zoom">
        <option value="fit">Fit</option><option value="0.5">50%</option><option value="0.75">75%</option>
        <option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option>
      </select></label>
      <label>Grid <select id="grid">
        <option value="1">off</option><option value="5">5 px</option><option value="10" selected>10 px</option><option value="20">20 px</option>
      </select></label>
      <label><input type="checkbox" id="showGrid" checked> show</label>
      <label><input type="checkbox" id="livePreview" checked> live values</label>
      <span class="spacer"></span>
      <span id="cursorPos" class="muted"></span>
    </div>
    <div id="stageWrap">
      <div id="stage"></div>
    </div>
  </section>
  <aside id="right">
    <nav id="modes" class="modes"></nav>
    <div id="panel" class="panel"></div>
  </aside>
</main>
<div id="toasts"></div>
<div id="modal" class="modal" hidden><div class="modal-box"><div id="modalBody"></div><div class="modal-actions"><button id="modalClose">Close</button></div></div></div>
<script src="app.js"></script>
</body>
</html>
