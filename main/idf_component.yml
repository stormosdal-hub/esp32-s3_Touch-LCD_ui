dependencies:
  idf: ">=5.5"
  lvgl/lvgl: "~9.4.0"
  espressif/esp_lvgl_port: "^2.6.0"
  espressif/esp_lcd_touch_gt911: "^1.1.3"
  joltwallet/littlefs: "^1.20.0"
  espressif/mdns: "^1.8.0"
  # cJSON and MQTT moved out of ESP-IDF in v6.0
  espressif/cjson:
    version: "^1.7.19"
    rules:
      - if: "idf_version >=6.0"
  espressif/mqtt:
    version: "^1.0.0"
    rules:
      - if: "idf_version >=6.0"
